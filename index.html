<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujian Online + MTs</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    /* Bar atas */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .topbar-title {
      font-size: 15px;
      font-weight: bold;
      color: #111827;
    }
    .topbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .status-pill {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-pill.ok {
      background: #dcfce7;
      color: #166534;
    }
    .status-pill.err {
      background: #fee2e2;
      color: #991b1b;
    }
    .status-pill.done {
      background: #dbeafe;
      color: #1e40af;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    #btnStartCam {
      background-color: #2563eb;
      color: #ffffff;
    }
    #btnStartCam:hover {
      background-color: #1d4ed8;
    }

    /* Tombol "Buka di Tab Baru" disembunyikan */
    #btnOpenTab {
      display: none !important;
    }

    /* Banner informasi saat soal sudah terkirim */
    .submitted-banner {
      display: none;
      width: 100%;
      max-width: 960px;
      margin-bottom: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #dbeafe;
      border: 1px solid #93c5fd;
      color: #1e3a8a;
      font-size: 13px;
      font-weight: bold;
    }

    /* Area utama Google Form tertanam */
    .exam-container {
      width: 100%;
      min-height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .form-frame-wrapper {
      width: 100%;
      max-width: 960px;
      height: 82vh;
      min-height: 540px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
      border: 1px solid #e5e7eb;
    }
    iframe#googleFormFrame {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Panel kontrol di bagian akhir/bawah halaman (muncul saat soal sudah dikirim) */
    .end-controls {
      display: none;
      width: 100%;
      max-width: 960px;
      margin-top: 14px;
      padding: 14px 16px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }
    .end-controls-label {
      font-size: 13px;
      font-weight: bold;
      color: #374151;
    }
    .end-controls-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    #btnStopCamEnd {
      background-color: #dc2626;
      color: #ffffff;
    }
    #btnStopCamEnd:hover {
      background-color: #b91c1c;
    }
    #btnHideCamEnd {
      background-color: #4b5563;
      color: #ffffff;
    }
    #btnHideCamEnd:hover {
      background-color: #374151;
    }

    .helper-note {
      max-width: 960px;
      width: 100%;
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    /* Kotak kamera mengambang */
    .floating-cam {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 220px;
      background: #111827;
      border: 2px solid #2563eb;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      z-index: 50;
      display: none;
      user-select: none;
      touch-action: none;
    }
    .floating-cam-header {
      background: #1f2937;
      color: #f9fafb;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
    }
    .floating-cam-header:active {
      cursor: grabbing;
    }
    .floating-cam-body {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000000;
    }
    video#camVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 5px;
    }

    @media (max-width: 600px) {
      .floating-cam {
        width: 145px;
        right: 12px;
        bottom: 12px;
      }
      .form-frame-wrapper {
        height: 76vh;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">Lembar Ujian Online</div>
    <div class="topbar-controls">
